# franklinwh-direct-connect-bridge — HA add-on + standalone REST/MQTT bridge for the
# FranklinWH LOCAL API. Depends on the franklinwh-direct-connect-api library; NO hybrid.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh-direct-connect-bridge"
version = "0.5.60"
description = "Home Assistant add-on / REST + MQTT bridge for the FranklinWH aGate local (sendMqtt) API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# GitHub noreply address, as franklinwh-modbus uses: PyPI shows this publicly (#782).
authors = [{name = "david2069", email = "david2069@users.noreply.github.com"}]
# 3.11 is what install-smoke.yml runs the pip install on; 3.12 is the Docker base image.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

dependencies = [
    # >=0.5 for the emulator's explicit site timezone (tz_offset_hours), its live 1202
    # clock and the 1702 install profile. The Home Assistant add-on installs this from
    # PyPI, so an unpinned dependency served 0.4.0 and adding a mock gateway failed
    # with TypeError (2026-10-15). mockgw degrades rather than failing now, but the
    # pin is what actually makes the feature available.
    "franklinwh-direct-connect-api>=0.6",
    # Pinned (#219): an unpinned >=0.9 put every new library release into users' builds
    # untested (0.9.6 and 0.10.0 in two days). 0.9.6 is the version G2 ran on (0.5.9,
    # reference aGate, 2026-10-18). Move the pin only after G0 + G1 (+ G2 for force paths).
    "franklinwh-modbus==0.13.0",      # direct-Modbus WSet force control (Battery Control widget)
    # The System view overlay (#428), shared with the Modbus Bridge. Pinned like the other
    # shared packages; move it only after G0 + G1.
    "franklinwh-system-view==0.5.1",
    "franklinwh-ha-notify==0.1.4",    # actionable HA notifications (#374)
    "hems==0.3.1",                    # the OUTUS engine: setup steps, OUTUS plans, bills (#613); forecasts (#713)
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "paho-mqtt>=2.0",
    "croniter>=2.0",          # cron trigger type (lazy import; gated on availability)
    "rainflow==3.2.0",        # weekly battery report: charge cycles by depth (MIT, no deps)
    "cryptography>=42",       # the HTTPS port's self-signed certificate (#457)
    "argon2-cffi>=23.1",      # account passwords, argon2id (#457)
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
# Cloud transport. Optional on purpose: without it the app runs local-only and every
# cloud-backed capability reports available=false / "library not installed" (see
# GET /api/providers). Declared here so `pip install -e ".[cloud]"` reproduces what
# the Docker image builds from wheels/ — previously this dep was implicit and a dev
# install silently lost reserve-SoC write.
# Pinned (#254): an open range put each release into the image untested. 0.6.0 adds the
# typed login errors, resolve_gateway and Client.aclose() that the bridge now relies on.
# Analytics → Cloud (#215): the shared period chart. Pinned like the other shared packages.
cloud = ["franklinwh-cloud==0.6.5", "franklinwh-ha-cloud-analytics==0.1.27"]

[project.urls]
Homepage = "https://github.com/david2069/franklinwh-direct-connect-bridge"
Documentation = "https://david2069.github.io/franklinwh-direct-connect-bridge/"
Issues = "https://github.com/david2069/franklinwh-direct-connect-bridge/issues"
Changelog = "https://github.com/david2069/franklinwh-direct-connect-bridge/blob/main/CHANGELOG.md"

[project.scripts]
franklinwh-direct-connect-bridge = "franklinwh_direct_connect_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The whole web UI, subfolders included (#487): "static/*" took only top-level files, so a
# pip install had no css/, js/, tabs/ or partials/ and its main page failed.
franklinwh_direct_connect_bridge = ["static/**/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
