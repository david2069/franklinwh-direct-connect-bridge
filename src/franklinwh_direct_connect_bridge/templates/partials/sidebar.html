<!-- ── Sidebar — Collapsible Navigation ─────────────────── -->
<aside x-data="{ hoverText: '', hoverTop: 0, hoverTimer: null }"
       :class="$store.app.sidebarCollapsed ? 'w-14' : 'w-56'"
       x-show="!$store.app.narrow" x-cloak
       class="flex flex-col bg-slate-800/50 border-r border-white/[0.08] flex-shrink-0 h-screen transition-all duration-300 relative">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-3 py-3 border-b border-white/[0.08] overflow-hidden">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 cursor-pointer"
         style="background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));"
         @click="$store.app.toggleSidebar()"
         :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms class="overflow-hidden whitespace-nowrap">
      <p class="text-sm font-bold text-slate-100 leading-tight">FranklinWH</p>
      <p class="text-[10px] text-slate-500 font-medium">Local Bridge</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 space-y-1" :class="$store.app.sidebarCollapsed ? 'px-1.5' : 'px-3'">

    <!-- Every tab from one registry, in the order the cog defines. Dashboard is
         pinned first and Settings second; both are locked on. Labels use the long
         form (tabTitles) because the sidebar has the width for it. -->
    <template x-for="tab in $store.app.sidebarTabs" :key="tab.key">
      <button @click="$store.app.setActiveTab(tab.key)"
              @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = $store.app.navLabel(tab.key); hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
              @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
              class="nav-item w-full"
              :class="[
                $store.app.activeTab === tab.key ? 'bg-emerald-500/10 text-emerald-300 border-l-2 border-emerald-400' : 'border-l-2 border-transparent',
                $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
              ]">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" x-html="tab.icon"></svg>
        <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms
              x-text="$store.app.navLabel(tab.key)"></span>
      </button>
    </template>

    <!-- Terminal: toggles the global console drawer (also ` / Ctrl-`). Not a view — a tool. -->
    <button x-show="$store.app.advancedTools" x-cloak @click="$store.app.toggleTerminal()"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Terminal'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.terminalOpen ? 'bg-emerald-500/10 text-emerald-300 border-l-2 border-emerald-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 9l3 3-3 3M13 15h4"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Terminal</span>
    </button>

    <!-- Guide: the franklinwh-local library docs (static mkdocs site at /guide),
         bundled into the image. Opens in a new tab; relative to <base> so it works
         behind the HA add-on ingress path too. Hidden if the docs weren't bundled? No —
         the link always shows; the server 404s cleanly if /guide isn't mounted. -->
    <button @click="$store.app.openGuide()"
       @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Guide'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
       @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
       class="nav-item w-full border-l-2 border-transparent"
       :class="$store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.5A2.5 2.5 0 0114.5 4H20v14h-6a2 2 0 00-2 2M12 6.5A2.5 2.5 0 009.5 4H4v14h6a2 2 0 012 2M12 6.5V20"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Guide</span>
    </button>

  </nav>

  <!-- Footer -->
  <div class="border-t border-white/[0.08] px-3 py-3">
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms
         class="text-[10px] text-slate-500 font-mono text-center"
         x-text="'v' + $store.app.version + ($store.app.buildAsset ? ' · ' + $store.app.buildAsset : '')"
         title="Running build — changes on every deploy; if it doesn't change after a reload, you're on a cached page"></div>
    <button x-show="!$store.app.sidebarCollapsed"
            @click="$store.app.setSidebar(true)"
            class="w-full flex items-center justify-center gap-1.5 mt-1 p-1 rounded hover:bg-slate-700/50 text-slate-600 hover:text-slate-400 transition text-[10px]">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/>
      </svg>
      <span>Collapse</span>
    </button>
    <!-- Expand (collapsed state). Was text-slate-600 + tiny + unlabelled, so it read
         as broken. Now a clear, full-size target with a tooltip. -->
    <button x-show="$store.app.sidebarCollapsed"
            @click="$store.app.setSidebar(false)"
            title="Expand sidebar"
            class="w-full flex items-center justify-center p-2 rounded-lg border border-white/[0.08]
                   bg-slate-700/40 hover:bg-slate-600/60 text-slate-300 hover:text-white transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <!-- Hover tooltip (visible only when collapsed) -->
  <div x-show="$store.app.sidebarCollapsed && hoverText !== ''"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 translate-x-1"
       x-transition:enter-end="opacity-100 translate-x-0"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="sidebar-tooltip fixed left-[60px] z-[200] text-xs font-medium px-2.5 py-1.5 rounded-md shadow-xl pointer-events-none whitespace-nowrap"
       :style="`top: ${hoverTop}px`"
       x-text="hoverText">
  </div>
</aside>
