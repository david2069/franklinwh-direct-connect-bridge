<div x-data="analyticsTab()" class="space-y-4 max-w-6xl">

  <div>
    <h1 class="text-xl font-semibold" style="color:var(--text-primary)">Analytics <a :href="$store.app.guideUrl('energy-and-costs/#analytics')" target="_blank" rel="noopener" class="text-xs underline normal-case tracking-normal font-normal ml-2" style="color:var(--text-secondary)" title="Opens the user guide at this topic">Guide</a></h1>
    <p class="text-sm text-slate-500" x-text="source === 'cloud' ? 'Energy history from the FranklinWH cloud.' : 'Power &amp; state history from the bridge\'s own store.'"></p>
  </div>

  <!-- One row for both sources (owner, 2026-11-09): the time span and Line | Area | Bars
       (2026-11-10), then Local | Cloud (#215), Export ▾ and Refresh; each serves whichever
       source is shown. -->
  <div class="flex items-center justify-between gap-2 flex-wrap">
    <div class="flex items-center gap-2 flex-wrap">
    <select class="form-control form-control-sm" style="width:auto" aria-label="Time span"
            :value="period" @change="setPeriod($event.target.value)">
      <template x-for="p in periods" :key="p[0]">
        <option :value="p[0]" x-text="p[1]" :selected="p[0] === period"></option>
      </template>
    </select>
      <!-- Chart ▾: every chart type in one button, remembered in this browser (owner, 2026-11-10) -->
      <div class="relative" role="group" aria-label="Chart style" x-data="{ open: false }" @click.outside="open = false">
        <button class="btn btn-secondary btn-sm inline-flex items-center gap-1.5" aria-label="Chart type" aria-haspopup="menu"
                :aria-expanded="open" @click="open = !open">
          <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19h16M7 16V9m5 7V5m5 11v-4"/></svg>
          <span x-text="chartLabel"></span>
          <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div x-show="open" x-cloak role="menu" class="absolute left-0 mt-1 w-40 rounded-lg border shadow-xl z-40 overflow-hidden"
             style="background:var(--surface-1);border-color:var(--border)">
            <button role="menuitemradio" :aria-checked="chartType === 'line'" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2" style="color:var(--text-primary)" @click="open = false; setChartType('line')">
              <span class="w-3 text-emerald-400" x-text="chartType === 'line' ? '✓' : ''"></span>Line</button>
            <button role="menuitemradio" :aria-checked="chartType === 'area'" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2" style="color:var(--text-primary)" title="Fill each line down to zero" @click="open = false; setChartType('area')">
              <span class="w-3 text-emerald-400" x-text="chartType === 'area' ? '✓' : ''"></span>Area</button>
            <button role="menuitemradio" :aria-checked="chartType === 'bars' && !stacked" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2" style="color:var(--text-primary)" @click="open = false; setBars(false)">
              <span class="w-3 text-emerald-400" x-text="chartType === 'bars' && !stacked ? '✓' : ''"></span>Bars</button>
            <button role="menuitemradio" :aria-checked="chartType === 'bars' && stacked" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2" style="color:var(--text-primary)" aria-label="Stacked bars" title="Stacked: where the energy came from above zero, where it went below" @click="open = false; setBars(true)">
              <span class="w-3 text-emerald-400" x-text="chartType === 'bars' && stacked ? '✓' : ''"></span>Bars stacked</button>
            <button role="menuitemradio" :aria-checked="chartType === 'flow'" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2" style="color:var(--text-primary)" title="Energy Flow: where the energy of the period came from and went" @click="open = false; setChartType('flow')">
              <span class="w-3 text-emerald-400" x-text="chartType === 'flow' ? '✓' : ''"></span>Flow</button>
            <button role="menuitem" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition flex items-center gap-2 border-t" style="color:var(--text-primary);border-color:var(--border)" title="A colour for each series, Local and Cloud" @click="open = false; coloursOpen = true">
              <span class="w-3"></span>Colours…</button>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <div class="inline-flex rounded-lg overflow-hidden border" style="border-color:var(--border)" role="tablist" aria-label="Source">
        <button class="px-4 py-1.5 text-sm font-semibold transition" role="tab" :aria-selected="source === 'local'"
                :class="source === 'local' ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
                @click="setSource('local')">Local</button>
        <button class="px-4 py-1.5 text-sm font-semibold transition border-l" style="border-color:var(--border)" role="tab" :aria-selected="source === 'cloud'"
                :class="source === 'cloud' ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
                @click="setSource('cloud')">Cloud</button>
      </div>
      <div class="relative inline-block" x-data="{ open: false }" @click.outside="open = false">
        <button class="btn btn-secondary btn-sm inline-flex items-center gap-1" aria-label="Export" aria-haspopup="menu"
                :aria-expanded="open" @click="open = !open">Export
          <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div x-show="open" x-cloak role="menu" class="absolute right-0 mt-1 w-28 rounded-lg border shadow-xl z-40 overflow-hidden"
             style="background:var(--surface-1);border-color:var(--border)">
          <button role="menuitem" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition" style="color:var(--text-primary)"
                  @click="open = false; exportData('csv')">CSV</button>
          <button role="menuitem" class="w-full text-left px-3 py-2 text-xs hover:bg-white/[0.06] transition border-t" style="color:var(--text-primary);border-color:var(--border)"
                  @click="open = false; exportData('json')">JSON</button>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" @click="refresh()" :disabled="loading">
        <span x-text="loading ? '…' : 'Refresh'"></span>
      </button>
    </div>
  </div>

  <!-- One date picker for Local, Cloud and Flow (owner, 2026-11-10): ‹ period › Today, a
       styled calendar (days, months or years) rather than the browser's own date input.
       Custom: From → To, each a day and a time from the same calendar and time grid. -->
  <div class="flex items-center justify-end gap-1 flex-wrap" x-show="period !== 'lifetime'">
    <button x-show="period !== 'custom'" class="btn btn-secondary btn-sm disabled:opacity-40 disabled:cursor-default" @click="stepWindow(-1)" :disabled="loading || atOldest"
            aria-label="Earlier" :title="atOldest ? 'No stored history before this' : 'Earlier'">‹</button>
    <div class="relative flex items-center gap-1" @click.outside="pickerOpen = false" @keydown.escape.window="pickerOpen = false">
      <button x-show="period !== 'custom'" class="btn btn-secondary btn-sm inline-flex items-center gap-1.5 min-w-[9.5rem] justify-center" aria-label="Pick a date"
              aria-haspopup="dialog" :aria-expanded="pickerOpen" @click="openPicker()">
        <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span x-text="periodLabel"></span>
      </button>
      <!-- Day views: the stretch shown, From and To beside the date (owner, 2026-11-10: "a
           start n end time"); a To at or before From is the next day's -->
      <button x-show="timeMode" class="btn btn-secondary btn-sm inline-flex items-center gap-1.5" aria-label="Start time"
              aria-haspopup="dialog" :aria-expanded="String(pickerOpen && pickerFor === 'dayfrom')" @click="openDayTime('from')">
        <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg><span class="text-slate-500">From</span><span class="font-mono" x-text="dayFromLabel"></span></button>
      <button x-show="timeMode" class="btn btn-secondary btn-sm inline-flex items-center gap-1.5" aria-label="End time"
              aria-haspopup="dialog" :aria-expanded="String(pickerOpen && pickerFor === 'dayto')" @click="openDayTime('to')">
        <span class="text-slate-500">To</span><span class="font-mono" x-text="dayToLabel"></span></button>
      <template x-if="period === 'custom'">
        <div class="flex items-center gap-1 flex-wrap justify-end" x-show="period === 'custom'">
          <button class="btn btn-secondary btn-sm inline-flex items-center gap-1.5" aria-label="From" aria-haspopup="dialog"
                  :aria-expanded="pickerOpen && pickerFor === 'from'" @click="openRange('from')">
            <span class="text-slate-500">From</span><span x-text="rangeLabel(rangeOrDefault.from)"></span></button>
          <span class="text-slate-500" aria-hidden="true">→</span>
          <button class="btn btn-secondary btn-sm inline-flex items-center gap-1.5" aria-label="To" aria-haspopup="dialog"
                  :aria-expanded="pickerOpen && pickerFor === 'to'" @click="openRange('to')">
            <span class="text-slate-500">To</span><span x-text="rangeLabel(rangeOrDefault.to)"></span></button>
        </div>
      </template>
      <div x-show="pickerOpen" x-cloak role="dialog" aria-label="Pick a date"
           class="absolute right-0 mt-1 z-40 w-72 rounded-xl border shadow-xl p-3 space-y-2"
           style="background:var(--surface-1);border-color:var(--border)">
        <p x-show="pickerFor !== 'period'" class="text-xs font-semibold" style="color:var(--text-primary)"
           x-text="{ from: 'From', to: 'To (not included)', dayfrom: 'From', dayto: 'To (at or before From: the next day)' }[pickerFor]"></p>
        <div x-show="pickerFor === 'period' || pickerFor === 'from' || pickerFor === 'to'" class="space-y-2">
        {% include "partials/calendar.html" %}
        </div>
        <!-- The time, from a styled grid (owner, 2026-11-10): a Day view's From / To (hourly
             snaps to the hour), or Custom's; minutes in 5-minute steps -->
        <div x-show="pickerFor !== 'period'" class="pt-2 border-t space-y-1.5" style="border-color:var(--border)">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-500">Time <span class="font-mono" style="color:var(--text-primary)"
                  x-text="gridHour + ':' + (gridMinutes ? gridMinute : '00')"></span></span>
            <button x-show="pickerFor === 'dayfrom' || pickerFor === 'dayto'" class="btn btn-secondary btn-sm" @click="clearDayTimes()"
                    title="Show the whole day">Whole day</button>
          </div>
          <div class="grid grid-cols-6 gap-0.5 text-center text-xs font-mono" role="group" aria-label="Hour">
            <template x-for="h in pickerHours" :key="h">
              <button class="py-1 rounded-md transition" :aria-pressed="String(h === gridHour)"
                      :class="h === gridHour ? 'bg-emerald-500/25 text-emerald-300 font-semibold' : 'hover:bg-white/[0.08]'"
                      @click="pickHour(h)" x-text="h"></button>
            </template>
          </div>
          <div x-show="gridMinutes" class="grid grid-cols-6 gap-0.5 text-center text-xs font-mono" role="group" aria-label="Minute">
            <template x-for="m in pickerMinutes" :key="m">
              <button class="py-1 rounded-md transition" :aria-pressed="String(m === gridMinute)"
                      :class="m === gridMinute ? 'bg-emerald-500/25 text-emerald-300 font-semibold' : 'hover:bg-white/[0.08]'"
                      @click="pickMinute(m)" x-text="':' + m"></button>
            </template>
          </div>
          <div x-show="pickerFor !== 'period'" class="flex items-center justify-end gap-2 pt-1">
            <span x-show="rangeErr" class="text-xs mr-auto" style="color:var(--danger, #f87171)" x-text="rangeErr"></span>
            <button class="btn btn-primary btn-sm" @click="pickerFor === 'dayfrom' || pickerFor === 'dayto' ? applyDayTime() : applyRange()">Apply</button>
          </div>
        </div>
      </div>
    </div>
    <button x-show="period !== 'custom'" class="btn btn-secondary btn-sm disabled:opacity-40 disabled:cursor-default" @click="stepWindow(1)" :disabled="loading || atToday" aria-label="Later" title="Later">›</button>
    <button x-show="period !== 'custom'" class="btn btn-secondary btn-sm disabled:opacity-40 disabled:cursor-default" @click="goToday()" :disabled="loading || atToday" title="Back to today">Today</button>
  </div>

  <!-- Cloud: the shared panel draws its dates and chart; the period comes from the top row. -->
  <div class="card" x-show="source === 'cloud' && chartType !== 'flow'" x-cloak>
    <!-- Only while the cloud account is missing or refused; hidden once it works. -->
    <p class="text-sm mb-3" style="color:var(--text-secondary)" x-show="!$store.app.cloudAvailable">Cloud account:
      <button class="underline" style="color:var(--accent, #34d399)" @click="openCloudSettings()">Settings → Integrations → FranklinWH Cloud API</button></p>
    <div x-ref="cloud"></div>
    <div class="flex justify-end mt-2">
      <button class="chip inline-flex items-center gap-1.5 transition" style="color:var(--text-secondary)"
              aria-label="Legend colours" title="Pick the legend's colours" @click="coloursOpen = true"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 100 18c.8 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16a5 5 0 005-5c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg><span>Colours</span></button>
    </div>
  </div>

  <!-- Flow (#543): the Energy Flow Sankey for the shown period, from Local or Cloud. -->
  <div class="card space-y-3" x-show="chartType === 'flow'" x-cloak>
    <p class="text-sm" style="color:var(--text-secondary)" x-show="source === 'cloud' && !$store.app.cloudAvailable">Cloud account:
      <button class="underline" style="color:var(--accent, #34d399)" @click="openCloudSettings()">Settings → Integrations → FranklinWH Cloud API</button></p>
    <p class="text-sm py-10 text-center" style="color:var(--text-secondary)" x-show="flowErr" x-text="flowErr"></p>
    <div class="fwh-sankey" x-ref="flow" x-show="!flowErr" style="min-height:380px"></div>
    <template x-if="flow && !flowErr">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-1 text-xs">
      <div class="flex justify-between gap-2"><span style="color:var(--solar,#f59e0b)">Solar</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.solar)"></span></div>
      <div class="flex justify-between gap-2"><span style="color:var(--accent,#22d3ee)">Home</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.home)"></span></div>
      <div class="flex justify-between gap-2"><span style="color:var(--ok,#34d399)">Charged</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.battery_charge)"></span></div>
      <div class="flex justify-between gap-2"><span style="color:var(--ok,#34d399)">Discharged</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.battery_discharge)"></span></div>
      <div class="flex justify-between gap-2"><span style="color:var(--violet,#a78bfa)">Export</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.grid_export)"></span></div>
      <div class="flex justify-between gap-2"><span style="color:var(--danger,#f87171)">Import</span>
        <span class="font-mono" style="color:var(--text-secondary)" x-text="kwh(flowNodes.grid_import)"></span></div>
    </div>
    </template>
    <p class="text-[0.65rem]" :class="flowWarn ? 'text-amber-400' : 'text-slate-500'" x-show="!flowErr" x-text="flowNote"></p>
  </div>

  <div class="space-y-4" x-show="source === 'local' && chartType !== 'flow'">
  <!-- One card, laid out as the Cloud view (owner, 2026-11-09): the chart, the chips under it. -->
  <div class="card space-y-3">

    <div x-show="!series.length && !loading" class="text-sm text-slate-500 py-16 text-center">
      No samples in this period.
    </div>
    <div class="relative" style="height:380px" x-show="series.length || loading">
      <canvas x-ref="canvas"></canvas>
    </div>
    <p class="text-[11px] text-slate-500" x-show="series.length" x-text="caption"></p>

    <div class="flex items-start justify-between gap-2 flex-wrap">
      <div class="flex flex-wrap gap-2">
        <template x-for="m in chips" :key="m.key">
          <button class="chip inline-flex items-center gap-1.5 transition"
                  :class="metrics[m.key] ? '' : 'opacity-40'"
                  :style="metrics[m.key] ? 'background:' + colourOf(m.key) + '22;color:' + colourOf(m.key) : ''"
                  @click="toggleMetric(m.key)">
            <span class="w-2 h-2 rounded-full" :style="'background:' + colourOf(m.key)"></span>
            <span x-text="m.label"></span>
          </button>
        </template>
          <!-- the legend's colours (owner, 2026-11-10), the same dialog as Chart ▾ → Colours… -->
          <button class="chip inline-flex items-center gap-1.5 transition" style="color:var(--text-secondary)"
                  aria-label="Legend colours" title="Pick the legend's colours" @click="coloursOpen = true"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 100 18c.8 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16a5 5 0 005-5c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg><span>Colours</span></button>
      </div>
    </div>
  </div>

  <!-- Stats strip -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <template x-for="s in stats" :key="s.label">
      <div class="card" style="padding:14px 16px">
        <div class="text-[10px] uppercase tracking-widest text-slate-500" x-text="s.label"></div>
        <div class="text-lg font-semibold tabular-nums" style="color:var(--text-primary)" x-text="s.value"></div>
      </div>
    </template>
  </div>

</div>

  <!-- Colours (owner, 2026-11-10): one colour per series for Local and Cloud, remembered in
       this browser; presets for a dark or light background, and the defaults. -->
  <div x-show="coloursOpen" x-cloak role="dialog" aria-modal="true" aria-label="Chart colours"
       @click.self="coloursOpen = false" @keydown.escape.window="coloursOpen = false"
       class="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
       style="z-index:80;background:rgba(0,0,0,.6)">
    <!-- above the phone's bottom tab bar (z-70) -->
    <div class="card w-full sm:max-w-sm max-h-[90dvh] overflow-y-auto space-y-3" style="padding:16px">
      <div class="flex items-center justify-between gap-2">
        <h4 class="text-base font-semibold" style="color:var(--text-primary)">Chart colours</h4>
        <button type="button" class="btn btn-secondary btn-sm" aria-label="Close" @click="coloursOpen = false">&times;</button>
      </div>
      <p class="text-xs text-slate-500">For Local and Cloud, remembered in this browser.</p>
      <div class="space-y-1">
        <!-- a styled palette per series, inside the dialog (owner, 2026-11-10: the browser's
             own picker covered the dialog on iPadOS and couldn't be closed) -->
        <template x-for="r in colourRows" :key="r[0]">
          <div>
            <button type="button" class="w-full flex items-center gap-3 py-1 text-left" :aria-expanded="String(colourEdit === r[0])"
                    @click="colourEdit = colourEdit === r[0] ? null : r[0]">
              <span class="fwh-swatch" :style="'background:' + colours[r[0]]"></span>
              <span class="text-sm flex-1" style="color:var(--text-primary)" x-text="r[1]"></span>
              <span class="text-xs font-mono text-slate-500" x-text="colours[r[0]]"></span>
            </button>
            <div x-show="colourEdit === r[0]" class="pl-10 pb-2 space-y-2">
              <div class="grid grid-cols-8 gap-1.5" role="group" :aria-label="'Colours for ' + r[1]">
                <template x-for="c in colourPalette" :key="c">
                  <button type="button" class="fwh-swatch" :style="'background:' + c + (c === colours[r[0]] ? ';outline:2px solid var(--text-primary);outline-offset:2px' : '')"
                          :aria-label="c" :aria-pressed="String(c === colours[r[0]])" @click="setColour(r[0], c)"></button>
                </template>
              </div>
              <label class="flex items-center gap-2 text-xs text-slate-500">Hex
                <input type="text" inputmode="text" maxlength="7" class="form-control form-control-sm font-mono" style="width:7rem"
                       :value="colours[r[0]]" @change="setColourHex(r[0], $event.target.value)" :aria-label="r[1] + ' as hex'">
              </label>
            </div>
          </div>
        </template>
      </div>
      <!-- Cloud's detailed metrics (Details ▾), each its source's colour until one is picked
           (owner, 2026-11-10) -->
      <div class="pt-2 border-t" style="border-color:var(--border)">
        <button type="button" class="w-full flex items-center justify-between text-sm py-1" style="color:var(--text-primary)"
                :aria-expanded="String(detailColoursOpen)" @click="detailColoursOpen = !detailColoursOpen">
          <span>Detailed metrics <span class="text-xs text-slate-500">(Cloud, Details ▾)</span></span>
          <span class="text-slate-500" x-text="detailColoursOpen ? '▾' : '▸'"></span>
        </button>
        <div x-show="detailColoursOpen" class="space-y-1 pt-1">
          <template x-for="r in detailRows" :key="r[0]">
            <div>
              <button type="button" class="w-full flex items-center gap-3 py-1 text-left" :aria-expanded="String(colourEdit === r[0])"
                      @click="colourEdit = colourEdit === r[0] ? null : r[0]">
                <span class="fwh-swatch" :style="'background:' + detailColour(r)"></span>
                <span class="text-sm flex-1" style="color:var(--text-primary)" x-text="r[1]"></span>
                <span class="text-xs font-mono text-slate-500" x-text="colours[r[0]] || 'as ' + colourRows.find(c => c[0] === r[2])[1].replace(/ \(.*\)$/, '')"></span>
              </button>
              <div x-show="colourEdit === r[0]" class="pl-10 pb-2 space-y-2">
                <div class="grid grid-cols-8 gap-1.5" role="group" :aria-label="'Colours for ' + r[1]">
                  <template x-for="c in colourPalette" :key="c">
                    <button type="button" class="fwh-swatch" :style="'background:' + c + (c === colours[r[0]] ? ';outline:2px solid var(--text-primary);outline-offset:2px' : '')"
                            :aria-label="c" :aria-pressed="String(c === colours[r[0]])" @click="setColour(r[0], c)"></button>
                  </template>
                </div>
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-2 text-xs text-slate-500">Hex
                    <input type="text" inputmode="text" maxlength="7" class="form-control form-control-sm font-mono" style="width:7rem"
                           :value="colours[r[0]] || ''" @change="setColourHex(r[0], $event.target.value)" :aria-label="r[1] + ' as hex'">
                  </label>
                  <button x-show="colours[r[0]]" type="button" class="btn btn-secondary btn-sm ml-auto" @click="clearDetailColour(r[0])">Use its source's</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 pt-2 border-t" style="border-color:var(--border)">
        <button type="button" class="btn btn-secondary btn-sm" @click="useColourPreset('dark')">Dark background</button>
        <button type="button" class="btn btn-secondary btn-sm" @click="useColourPreset('light')">Light background</button>
        <button type="button" class="btn btn-secondary btn-sm ml-auto" @click="resetColours()">Reset to defaults</button>
      </div>
      <div class="flex justify-end">
        <button type="button" class="btn btn-primary btn-sm" @click="coloursOpen = false; colourEdit = null">Done</button>
      </div>
    </div>
  </div>

</div>
