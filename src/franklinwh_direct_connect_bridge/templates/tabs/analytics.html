<div x-data="analyticsTab()" class="space-y-4 max-w-6xl">

  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div>
      <h1 class="text-xl font-semibold" style="color:var(--text-primary)">Analytics <a :href="$store.app.guideUrl('energy-and-costs/#analytics')" target="_blank" rel="noopener" class="text-xs underline normal-case tracking-normal font-normal ml-2" style="color:var(--text-secondary)" title="Opens the user guide at this topic">Guide</a></h1>
      <p class="text-sm text-slate-500" x-text="source === 'cloud' ? 'Energy history from the FranklinWH cloud.' : 'Power &amp; state history from the bridge\'s own store.'"></p>
    </div>
    <div class="flex items-center gap-2" x-show="source === 'local'">
      <button class="btn btn-secondary btn-sm" @click="exportData('csv')">Export CSV</button>
      <button class="btn btn-secondary btn-sm" @click="exportData('json')">JSON</button>
      <button class="btn btn-secondary btn-sm" @click="load()" :disabled="loading">
        <span x-text="loading ? '…' : 'Refresh'"></span>
      </button>
    </div>
  </div>

  <!-- Local: this bridge's own samples. Cloud: the FranklinWH cloud's history (#215).
       Its own row, full size, so it is not lost in the header. -->
  <div class="inline-flex rounded-lg overflow-hidden border" style="border-color:var(--border)" role="tablist" aria-label="Source">
    <button class="px-5 py-2 text-sm font-semibold transition" role="tab" :aria-selected="source === 'local'"
            :class="source === 'local' ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
            @click="setSource('local')">Local</button>
    <button class="px-5 py-2 text-sm font-semibold transition border-l" style="border-color:var(--border)" role="tab" :aria-selected="source === 'cloud'"
            :class="source === 'cloud' ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
            @click="setSource('cloud')">Cloud</button>
  </div>

  <!-- Cloud: the shared panel draws its own period, dates and chart. -->
  <div class="card" x-show="source === 'cloud'" x-cloak>
    <p class="text-sm mb-3" style="color:var(--text-secondary)">Cloud account:
      <button class="underline" style="color:var(--accent, #34d399)" @click="openCloudSettings()">Settings → Integrations → FranklinWH Cloud API</button></p>
    <div x-ref="cloud"></div>
  </div>

  <div class="space-y-4" x-show="source === 'local'">
  <!-- Range + chart controls -->
  <div class="card space-y-3">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <!-- range presets -->
      <div class="inline-flex rounded-lg overflow-hidden border" style="border-color:var(--border)">
        <template x-for="r in ranges" :key="r.key">
          <button class="px-3 py-1.5 text-xs font-medium transition"
                  :class="range === r.key && !custom ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
                  @click="setRange(r.key)" x-text="r.label"></button>
        </template>
        <button class="px-3 py-1.5 text-xs font-medium transition"
                :class="custom ? 'bg-emerald-500/20 text-emerald-300' : 'text-slate-400 hover:text-slate-200'"
                @click="custom = true">Custom</button>
      </div>
      <!-- chart type -->
      <div class="inline-flex rounded-lg overflow-hidden border" style="border-color:var(--border)">
        <button class="px-3 py-1.5 text-xs font-medium transition"
                :class="chartType === 'line' ? 'bg-slate-700 text-slate-100' : 'text-slate-400'"
                @click="chartType = 'line'; render()">Line</button>
        <button class="px-3 py-1.5 text-xs font-medium transition"
                :class="chartType === 'area' ? 'bg-slate-700 text-slate-100' : 'text-slate-400'"
                @click="chartType = 'area'; render()">Area</button>
      </div>
    </div>

    <!-- custom date range -->
    <div x-show="custom" x-cloak class="flex items-center gap-2 flex-wrap">
      <label class="text-xs text-slate-500">From
        <input type="datetime-local" step="60" class="form-control form-control-sm ml-1" x-model="customStart"></label>
      <label class="text-xs text-slate-500">To
        <input type="datetime-local" step="60" class="form-control form-control-sm ml-1" x-model="customEnd"></label>
      <button class="btn btn-secondary btn-sm" @click="applyCustom()">Apply</button>
      <button class="btn btn-ghost btn-sm" @click="resetCustom()" title="Today 00:00 to now">Today</button>
      <span class="text-[11px] text-slate-500" x-text="'Times in ' + zoneLabel"></span>
    </div>

    <!-- metric toggles -->
    <div class="flex flex-wrap gap-2">
      <template x-for="m in metricDefs" :key="m.key">
        <button class="chip inline-flex items-center gap-1.5 transition"
                :class="metrics[m.key] ? '' : 'opacity-40'"
                :style="metrics[m.key] ? 'background:' + m.color + '22;color:' + m.color : ''"
                @click="toggleMetric(m.key)">
          <span class="w-2 h-2 rounded-full" :style="'background:' + m.color"></span>
          <span x-text="m.label"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Stats strip -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <template x-for="s in stats" :key="s.label">
      <div class="card" style="padding:14px 16px">
        <div class="text-[10px] uppercase tracking-widest text-slate-500" x-text="s.label"></div>
        <div class="text-lg font-semibold tabular-nums" style="color:var(--text-primary)" x-text="s.value"></div>
      </div>
    </template>
  </div>

  <!-- Chart -->
  <div class="card">
    <div x-show="!series.length && !loading" class="text-sm text-slate-500 py-16 text-center">
      No samples in this range.
    </div>
    <div class="relative" style="height:380px" x-show="series.length || loading">
      <canvas x-ref="canvas"></canvas>
    </div>
    <p class="text-[11px] text-slate-500 mt-2" x-show="series.length"
       x-text="caption"></p>
  </div>

</div>

</div>
