<!-- ── Health Tab ─────────────────────────────────────────── -->
<div x-data="healthTab" class="space-y-6 max-w-2xl">

  <!-- Connection -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="px-5 py-3 border-b border-white/[0.06]">
      <div class="card-label" style="margin-bottom:0">Connection</div>
    </div>
    <table class="data-table">
      <tbody>
        <tr><td class="text-slate-500">Host</td><td class="font-mono text-right" x-text="$store.app.summary.host || '--'"></td></tr>
        <tr>
          <td class="text-slate-500">Status</td>
          <td class="text-right">
            <span class="chip ok" x-show="$store.app.isOnline">Online</span>
            <span class="chip error" x-show="!$store.app.isOnline">Offline</span>
          </td>
        </tr>
        <tr><td class="text-slate-500">Round-trip latency</td><td class="font-mono text-right"><span x-text="fmt.ms($store.app.summary.latency_ms)"></span> ms</td></tr>
        <tr>
          <td class="text-slate-500">aGate Modbus TCP Server :502</td>
          <td class="text-right">
            <span class="chip ok" x-show="$store.app.summary.modbus_502 === true">Up</span>
            <span class="chip error" x-show="$store.app.summary.modbus_502 === false">Down</span>
            <span class="chip muted" x-show="$store.app.summary.modbus_502 == null"
                  title="Not measured: the Modbus client of this bridge is off, this is a mock gateway, or it has not connected yet. The bridge does not probe the Modbus TCP Server of the aGate (:502) to show this; it reports its last real connection (a force, release, ratings read or Test). This is not a statement about the gateway — its own SunSpec Modbus setting is on the SunSpec Modbus card.">Not probed</span>
          </td>
        </tr>
        <tr><td class="text-slate-500">Ping</td><td class="font-mono text-right" x-text="$store.app.summary.ping ?? 'n/a'"></td></tr>
        <tr><td class="text-slate-500">Rediscovered</td><td class="font-mono text-right" x-text="String($store.app.summary.rediscovered ?? false)"></td></tr>
        <tr><td class="text-slate-500">MQTT</td><td class="font-mono text-right" x-text="$store.app.summary.mqtt_enabled ? 'enabled' : 'disabled'"></td></tr>
        <tr><td class="text-slate-500">Writes</td><td class="font-mono text-right" x-text="$store.app.summary.writes_enabled ? 'enabled' : 'disabled'"></td></tr>
      </tbody>
    </table>
  </div>

  <!-- Firmware — the DETAIL view. Health already spelled the tags out in plain
       words, so the full per-component and per-battery data lives here rather
       than sending the reader to the Device tab's raw codes. -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="px-5 py-3 border-b border-white/[0.06] flex items-center justify-between gap-3">
      <div class="card-label" style="margin-bottom:0">Firmware</div>
      <button @click="load()" class="chip muted" style="font-size:.65rem"
              :disabled="loading" x-text="loading ? 'Reading…' : 'Refresh'">Refresh</button>
    </div>

    <div x-show="error" x-cloak class="px-5 py-3 text-xs" style="color:#fca5a5" x-text="error"></div>

    <table class="data-table" x-show="fw">
      <tbody>
        <template x-for="[k, v] in gatewayRows" :key="k">
          <tr>
            <td class="text-slate-500">
              <span x-text="label(k)"></span>
              <span class="font-mono text-[10px] opacity-50 ml-1" x-text="k"></span>
            </td>
            <td class="font-mono text-right break-all" x-text="value(v)"></td>
          </tr>
        </template>
      </tbody>
    </table>

    <div x-show="fw && serialRows.length" class="px-5 pt-3 pb-1 text-xs uppercase tracking-wide"
         style="color:var(--text-secondary)">Serials</div>
    <table class="data-table" x-show="fw && serialRows.length">
      <tbody>
        <template x-for="[k, v] in serialRows" :key="k">
          <tr>
            <td class="text-slate-500">
              <span x-text="label(k)"></span>
              <span class="font-mono text-[10px] opacity-50 ml-1" x-text="k"></span>
            </td>
            <td class="font-mono text-right break-all" x-text="value(v)"></td>
          </tr>
        </template>
      </tbody>
    </table>

    <template x-for="dev in batteries" :key="dev.id">
      <div>
        <div class="px-5 pt-3 pb-1 text-xs uppercase tracking-wide"
             style="color:var(--text-secondary)"
             x-text="`aPower ${dev.id}`"></div>
        <div x-show="dev.error" class="px-5 pb-2 text-xs" style="color:#fca5a5" x-text="dev.error"></div>
        <table class="data-table" x-show="!dev.error">
          <tbody>
            <template x-for="[k, v] in deviceRows(dev)" :key="k">
              <tr>
                <td class="text-slate-500">
                  <span x-text="label(k)"></span>
                  <span class="font-mono text-[10px] opacity-50 ml-1" x-text="k"></span>
                </td>
                <td class="font-mono text-right break-all" x-text="value(v)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <div x-show="!fw && !loading && !error" class="px-5 py-4 text-xs"
         style="color:var(--text-secondary)">No reading yet.</div>
  </div>

  <!-- Link & load (#123): reachability, this bridge's connections to the aGate, and the
       bridge's own resource use. Read-only; never opens the aGate Modbus TCP Server :502. -->
  <div class="card" style="padding:0;overflow:hidden"
       x-data="{ d: null, busy: false, err: '',
                 async load() { this.busy = true; this.err = '';
                   try { const r = await fetch('api/diagnostics/link' + $store.app.gwQuery('?'));
                         this.d = await r.json(); }
                   catch (e) { this.err = String(e); } finally { this.busy = false; } } }">
    <div class="px-5 py-3 flex items-center justify-between" style="border-bottom:1px solid var(--border)">
      <div class="text-xs font-semibold uppercase tracking-wider" style="color:var(--text-secondary)">Link &amp; load</div>
      <button class="btn-secondary text-xs" @click="load()" :disabled="busy"
              x-text="busy ? 'Checking…' : (d ? 'Check again' : 'Check')"></button>
    </div>
    <div class="px-5 py-3 text-xs" x-show="err" style="color:var(--danger)" x-text="err"></div>
    <template x-if="d">
      <div class="px-5 py-3 text-sm space-y-3">
        <template x-for="g in d.gateways" :key="g.id">
          <div>
            <div class="font-medium" x-text="g.label + (g.is_mock ? ' (mock — not probed)' : '')"></div>
            <div x-show="!g.is_mock" class="grid grid-cols-2 gap-x-4 text-xs mt-1" style="color:var(--text-secondary)">
              <span>Ping</span><span x-text="g.ping ? (g.ping_ms + ' ms') : 'no reply'"></span>
              <span>Connect :9000</span><span x-text="g.dc_9000 ? (g.dc_9000_connect_ms + ' ms') : 'refused / timed out'"></span>
              <span>This bridge's connections :9000</span>
              <span x-text="g.connections ? g.connections.dc_9000 : 'n/a (not in a container)'"></span>
              <span>… to the aGate Modbus TCP Server :502</span>
              <span x-text="g.connections ? g.connections.modbus_tcp_server_502 : 'n/a'"></span>
            </div>
          </div>
        </template>
        <div class="text-xs pt-2" style="border-top:1px solid var(--border);color:var(--text-secondary)">
          Bridge: CPU <span x-text="d.bridge.cpu_pct ?? '–'"></span>% ·
          memory <span x-text="d.bridge.rss_mb ?? '–'"></span> MB ·
          threads <span x-text="d.bridge.threads ?? '–'"></span> ·
          open files <span x-text="d.bridge.open_fds ?? '–'"></span>
        </div>
      </div>
    </template>
  </div>

</div>
