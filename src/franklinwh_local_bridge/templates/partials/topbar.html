<!-- ── Topbar ─────────────────────────────────────────── -->
<!-- Wraps to a second line on narrow screens rather than pushing the SoC/mode
     chips off-screen right (the mobile overflow the user saw). -->
<header class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 lg:px-6 py-3 border-b border-white/[0.08] bg-slate-800/30 sticky top-0 z-50">

  <!-- Left: Sidebar toggle + Page title -->
  <div class="flex items-center gap-3">
    <button @click="$store.app.toggleSidebar()"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              :d="$store.app.sidebarCollapsed ? 'M9 5l7 7-7 7' : 'M15 5l-7 7 7 7'"/>
      </svg>
    </button>

    <h1 class="text-sm font-semibold text-slate-300 uppercase tracking-wider"
        x-text="$store.app.tabTitle">
    </h1>
  </div>

  <!-- Global Release: always reachable while a force dispatch is active (VPP mode) -->
  <button x-show="$store.app.batteryActive && $store.app.batteryActive !== 'Not Active'" x-cloak
          @click="$store.app.releaseBattery()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold text-white animate-pulse"
          style="background:var(--danger)"
          :title="'Force active: ' + $store.app.batteryActive + ($store.app.batteryRemaining != null ? ' (' + $store.app.batteryRemaining + 's left)' : '')">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    Release
  </button>

  <!-- Right: Status chips + theme toggle -->
  <div class="flex flex-wrap items-center justify-end gap-2 sm:gap-3 min-w-0 w-full sm:w-auto">

    <!-- Gateway selector (multi-gateway only) — styled dropdown, matching the mode menu. -->
    <div class="relative" x-show="$store.app.gateways.length > 1"
         @click.outside="$store.app.gwMenuOpen = false">
      <button class="chip muted inline-flex items-center gap-1" @click="$store.app.gwMenuOpen = !$store.app.gwMenuOpen"
              title="Select gateway">
        <span class="truncate max-w-[9rem]" x-text="$store.app.selectedGatewayLabel"></span>
        <svg class="w-3 h-3 opacity-70 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div x-show="$store.app.gwMenuOpen" x-cloak x-transition
           class="absolute right-0 mt-1 w-56 rounded-lg border shadow-xl z-[120] overflow-hidden"
           style="background:var(--surface-1);border-color:var(--border)">
        <div class="px-3 py-2 text-[10px] uppercase tracking-wide border-b"
             style="color:var(--text-secondary);border-color:var(--border)">Gateway</div>
        <!-- Site aggregate (all gateways) — sums power, averages SoC. -->
        <button class="w-full text-left px-3 py-2.5 flex items-center justify-between gap-2 hover:bg-white/[0.05] transition-colors border-b"
                style="border-color:var(--border)"
                @click="$store.app.gwMenuOpen = false; $store.app.selectGateway('__site__')">
          <span class="text-sm flex items-center gap-1.5" :style="$store.app.siteMode ? 'color:#34d399' : 'color:var(--text-primary)'">
            <svg class="w-3.5 h-3.5 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
            Site (All Gateways)
          </span>
          <svg x-show="$store.app.siteMode" class="w-4 h-4 shrink-0" style="color:#34d399"
               fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </button>
        <template x-for="g in $store.app.gateways" :key="g.id">
          <button class="w-full text-left px-3 py-2.5 flex items-center justify-between gap-2 hover:bg-white/[0.05] transition-colors"
                  @click="$store.app.gwMenuOpen = false; $store.app.selectGateway(g.id)">
            <span class="flex items-center gap-1.5 min-w-0">
              <span class="text-sm truncate" :style="g.id === $store.app.selectedGateway ? 'color:#34d399' : 'color:var(--text-primary)'"
                    x-text="g.label || g.host"></span>
              <!-- per-gateway state badges (lazy-polled from the roster) -->
              <span x-show="g.off_grid" class="chip offgrid" style="padding:0 6px;font-size:.6rem">OFF-GRID</span>
              <span x-show="g.vpp_kind === 'vpp' && !g.off_grid" class="chip vpp" style="padding:0 6px;font-size:.6rem">VPP</span>
              <span x-show="g.vpp && g.vpp_kind !== 'vpp' && !g.off_grid" class="chip vpp" style="padding:0 6px;font-size:.6rem">FORCE</span>
            </span>
            <svg x-show="g.id === $store.app.selectedGateway" class="w-4 h-4 shrink-0" style="color:#34d399"
                 fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          </button>
        </template>
      </div>
    </div>

    <!-- Connection -->
    <div class="chip" :class="$store.app.isOnline ? 'ok' : 'error'">
      <span class="w-1.5 h-1.5 rounded-full"
            :class="$store.app.isOnline ? 'bg-emerald-400' : 'bg-red-400'"></span>
      <span x-text="$store.app.isOnline ? 'Online' : 'Offline'"></span>
    </div>

    <!-- Operating mode — tap to switch. Each choice confirms before switching. -->
    <div class="relative" x-show="$store.app.activeMode !== '--'"
         @click.outside="$store.app.modeMenuOpen = false">
      <button class="chip muted inline-flex items-center gap-1"
              @click="$store.app.modeMenuOpen = !$store.app.modeMenuOpen"
              title="Switch operating mode">
        <span x-text="$store.app.activeMode"></span>
        <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div x-show="$store.app.modeMenuOpen" x-cloak x-transition
           class="absolute right-0 mt-1 w-52 rounded-lg border shadow-xl z-[120] overflow-hidden"
           style="background:var(--surface-1);border-color:var(--border)">
        <div class="px-3 py-2 text-[10px] uppercase tracking-wide border-b"
             style="color:var(--text-secondary);border-color:var(--border)">Operating mode</div>
        <template x-for="m in $store.app.modeChoices" :key="m.alias">
          <button class="w-full text-left px-3 py-2.5 flex items-center justify-between gap-2
                         hover:bg-white/[0.05] transition-colors"
                  :disabled="m.active"
                  @click="$store.app.modeMenuOpen = false; if (!m.active) $store.app.setMode(m.alias)">
            <span class="text-sm" :style="m.active ? 'color:#34d399' : 'color:var(--text-primary)'"
                  x-text="m.label"></span>
            <span x-show="m.active" class="text-[10px]" style="color:#34d399">active</span>
          </button>
        </template>
        <div class="px-3 py-1.5 text-[10px] border-t" style="color:var(--text-faint);border-color:var(--border)"
             x-show="!$store.app.summary.writes_enabled">Read-only — enable writes to switch.</div>
      </div>
    </div>

    <!-- OFF-GRID — unmissable, always visible (even on mobile) when the aGate is islanded. -->
    <div class="chip offgrid inline-flex items-center gap-1" x-show="$store.app.isOffGrid" x-cloak
         title="The gateway is disconnected from the grid, running on battery">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.36 6.64A9 9 0 1 1 5.64 6.64M12 2v10"/></svg>
      <span>OFF-GRID</span>
    </div>

    <!-- VPP — cloud-CONFIRMED (getDeviceCompositeInfo run_status/tou_mode==9). -->
    <div class="chip vpp inline-flex items-center gap-1" x-show="$store.app.isVpp && !$store.app.isOffGrid" x-cloak
         :title="'VPP dispatch active' + ($store.app.vppProgramme ? ' — ' + $store.app.vppProgramme : '')">
      <span class="w-1.5 h-1.5 rounded-full bg-current"></span><span>VPP</span>
    </div>

    <!-- FORCE — a dispatch the Cloud has NOT confirmed as VPP (Modbus M704 WSet: a local
         force_charge, the Modbus bridge, the app, or a not-yet-classified cloud VPP). -->
    <div class="chip vpp inline-flex items-center gap-1" x-show="$store.app.isForced && !$store.app.isVpp && !$store.app.isOffGrid" x-cloak
         title="A force dispatch is holding the battery. The local/Modbus API can't confirm whether it's a VPP — that needs the Cloud API.">
      <span class="w-1.5 h-1.5 rounded-full bg-current"></span><span>FORCE</span>
    </div>

    <!-- Charge / run status — visible from small tablets up (was md-only, so it vanished
         on portrait / iPad-mini widths where the user expected the run status). -->
    <div class="chip hidden sm:inline-flex"
         :class="$store.app.chargeStateClass"
         x-text="$store.app.chargeState"></div>

    <!-- SoC -->
    <div class="chip muted" x-show="$store.app.socPct !== null">
      <span x-text="'SoC ' + $store.app.socPct + '%'"></span>
    </div>

    <!-- Round-trip latency -->
    <span class="text-xs text-slate-500 hidden lg:inline"
          x-show="$store.app.summary.latency_ms != null"
          x-text="Math.round($store.app.summary.latency_ms) + ' ms'"></span>

    <!-- Raw-key / cmdType toggle (Modbus-Bridge '</>' style) — shows the raw API key +
         cmdType next to field labels in Live Points / Device tab. -->
    <button @click="$store.app.toggleRawKeys()"
            class="inline-flex p-1.5 rounded transition"
            :class="$store.app.showRawKeys ? 'text-primary bg-slate-700' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
            :title="$store.app.showRawKeys ? 'Hide raw keys / cmdTypes' : 'Show raw keys / cmdTypes'">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l-4 3 4 3m8-6l4 3-4 3M14 5l-4 14"/>
      </svg>
    </button>

    <!-- Theme toggle -->
    <button @click="$store.app.toggleTheme()"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            :title="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg x-show="$store.app.theme === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg x-show="$store.app.theme === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

</header>
