<!-- Global terminal console — bottom drawer. Toggle with ` (backtick) or Ctrl-`; Escape closes. -->
<div x-data="terminalConsole()" x-init="init()" @keydown.window="onGlobalKey($event)">

  <!-- Open: the drawer -->
  <div x-show="open" x-cloak
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       class="fixed z-[120] inset-x-0 bottom-0 flex flex-col"
       :style="{ height: height + 'px', background: 'var(--surface-1)', borderTop: '1px solid var(--border)', boxShadow: '0 -12px 30px rgba(0,0,0,.28)' }">

    <!-- drag grip: resize the drawer height (persists) -->
    <div @pointerdown="startResize($event)" class="shrink-0 h-2.5 cursor-ns-resize flex items-center justify-center"
         style="touch-action:none" title="Drag to resize">
      <div class="w-10 h-1 rounded-full" style="background:var(--text-faint)"></div>
    </div>

    <!-- header -->
    <div class="flex items-center gap-3 px-3 py-1.5 shrink-0" style="border-bottom:1px solid var(--border)">
      <span class="text-xs font-semibold font-mono" style="color:var(--text-primary)">›_ terminal</span>
      <span class="text-[11px] font-mono px-1.5 py-0.5 rounded" style="background:var(--surface-2);color:var(--text-secondary)"
            x-text="promptHost"></span>
      <span class="text-[11px]" style="color:var(--text-faint)">implicit --host · writes need <span class="font-mono">--yes</span></span>
      <span x-show="busy" class="text-[11px]" style="color:var(--accent)">running…</span>
      <div class="ml-auto flex items-center gap-1">
        <button @click="cfgOpen=!cfgOpen" class="chip muted" :class="cfgOpen ? '' : ''" style="font-size:.6rem" title="Theme & accent">
          <svg class="w-3 h-3 inline-block align-[-1px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button @click="lines=[]" class="chip muted" style="font-size:.6rem" title="Clear screen (Ctrl-L)">clear</button>
        <button @click="open=false" class="chip muted" style="font-size:.6rem" title="Close (Esc)">&times; close</button>
      </div>
    </div>

    <!-- inline theme + accent panel (header cog) -->
    <div x-show="cfgOpen" x-cloak class="flex items-center gap-2 px-3 py-1.5 shrink-0 text-[11px] flex-wrap" style="border-bottom:1px solid var(--border)">
      <span style="color:var(--text-secondary)">theme</span>
      <button @click="$store.app.toggleTheme()" class="chip muted font-mono" style="font-size:.6rem" x-text="$store.app.theme"></button>
      <span style="color:var(--text-secondary)" class="ml-2">accent</span>
      <template x-for="a in $store.app.accents" :key="a.color">
        <button @click="$store.app.setAccent(a.color)" :title="a.name" class="w-4 h-4 rounded-full shrink-0"
                :style="'background:'+a.color+';box-shadow:'+(($store.app.accent||'#22c55e')===a.color ? '0 0 0 2px var(--surface-1),0 0 0 3px '+a.color : '0 0 0 1px var(--border)')"></button>
      </template>
      <input type="color" :value="$store.app.accent || '#22c55e'" @input="$store.app.setAccent($event.target.value)"
             class="w-5 h-5 rounded cursor-pointer shrink-0" style="border:1px solid var(--border);background:transparent" title="Custom colour">
      <button @click="$store.app.setAccent('')" class="chip muted" style="font-size:.55rem" title="Reset to default">reset</button>
    </div>

    <!-- output log -->
    <div x-ref="log" class="flex-1 overflow-y-auto px-3 py-2 font-mono text-xs leading-relaxed"
         style="color:var(--text-secondary)" @click="$refs.input && $refs.input.focus()">
      <template x-for="(ln, i) in lines" :key="i">
        <pre class="whitespace-pre-wrap break-words"
             :style="ln.kind==='in' ? 'color:var(--text-primary)' : (ln.kind==='err' ? 'color:var(--danger,#ef4444)' : (ln.kind==='out' ? 'color:var(--text-primary)' : 'color:var(--text-secondary)'))"
             x-text="ln.text"></pre>
      </template>
    </div>

    <!-- one-tap presets (touch): tap to run a curated safe read; horizontal scroll -->
    <div class="flex gap-1.5 px-3 py-1.5 shrink-0 overflow-x-auto whitespace-nowrap"
         style="border-top:1px solid var(--border)">
      <template x-for="p in presets" :key="p.cmd">
        <button @click="quick(p.cmd)" :disabled="busy" :title="'runs: ' + p.cmd"
                class="shrink-0 rounded-full px-2.5 py-1 text-xs font-mono"
                style="background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)"
                x-text="p.label"></button>
      </template>
    </div>
    <!-- input row -->
    <div class="flex items-center gap-2 px-3 py-2 shrink-0 font-mono text-xs" style="border-top:1px solid var(--border)"
         @click="$refs.input && $refs.input.focus()">
      <span style="color:var(--accent)" x-text="promptHost + ' ›'"></span>
      <input x-ref="input" x-model="input" @keydown="onKey($event)"
             type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             class="flex-1 outline-none border-0"
             style="color:var(--text-primary);background:transparent;caret-color:var(--accent)" placeholder="power_flow · call 1405 · catalog · help">
    </div>
  </div>
</div>
