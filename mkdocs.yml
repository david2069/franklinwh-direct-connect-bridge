      - METRICS_GAP_ANALYSIS.md
      - MODBUS_EXPORT_CONTROL.md
      - MODBUS_STATES.md
      - MODBUS_SUSPEND_PLAN.md
      - MODBUS_VIA_REST_DESIGN.md
      - MULTI_GATEWAY_AND_HA_PLAN.md
      - OBSERVABILITY_COVERAGE.md
